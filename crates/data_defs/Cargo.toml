# Layer: service. May depend on: sim_*, core_* + external crates
# (ron: ADR 0004). data_defs loads each sim crate's config schema types
# (ADR 0005 §6): the schemas live with the crate that consumes them.
[package]
name = "data_defs"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
core_types = { workspace = true }
sim_people = { workspace = true }
sim_world = { workspace = true }
sim_ai = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
ron = { workspace = true }
